<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Silkscreen&display=swap">
<style>
:root{--sky:#cfe4ea;--paper:#f3e9d2;--paper-2:#e2d3b1;--ink:#33241b;--edge:#241912;--gold:#f0b43a;--hp:#d8452e;--ok:#5cae3c;--font-display:"Pixelify Sans","Courier New",monospace;--font-label:"Silkscreen","Courier New",monospace;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);overflow:hidden;font-family:var(--font-display);-webkit-user-select:none;user-select:none;touch-action:none}
#app{position:fixed;inset:0;overflow:hidden;background:var(--sky);touch-action:none}
#view{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.panel{background:var(--paper);border:3px solid var(--edge);box-shadow:0 4px 0 var(--edge),inset 0 -3px 0 var(--paper-2)}
.ui{position:fixed;pointer-events:none}
.ui .panel,.ui button,#joy{pointer-events:auto}
#zone{left:max(12px,env(safe-area-inset-left));top:calc(env(safe-area-inset-top,0px) + 12px);padding:6px 12px;font-size:19px;font-weight:700}
#zone small{display:block;font-family:var(--font-label);font-size:9px;font-weight:400;opacity:.6;letter-spacing:.5px;margin-top:1px}
#mates{right:max(12px,env(safe-area-inset-right));top:calc(env(safe-area-inset-top,0px) + 12px);padding:6px 10px;max-width:46vw;font-size:15px}
#mates .lb{font-family:var(--font-label);font-size:9px;opacity:.65;display:block}
#mates .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
#mates .chips span{border:2px solid var(--edge);padding:0 6px;background:#fff;font-size:13px}
#bubble{display:none;transform:translate(-50%,-100%);font-size:30px;background:#fff;border:3px solid var(--edge);border-radius:16px;padding:0 9px;line-height:1.3;box-shadow:0 3px 0 var(--edge)}
#bubble::after{content:'';position:absolute;left:50%;bottom:-10px;width:11px;height:11px;background:#fff;border-right:3px solid var(--edge);border-bottom:3px solid var(--edge);transform:translateX(-50%) rotate(45deg)}
button{font-family:inherit;font-size:16px;font-weight:700;color:var(--ink);background:#fff;border:3px solid var(--edge);box-shadow:0 4px 0 var(--edge);padding:6px 6px;min-height:48px;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
button .e{font-size:24px;display:block;line-height:1}
.chip{display:inline-block;padding:0 7px;border:2px solid var(--edge);color:#fff;font-size:12px;font-weight:700;text-shadow:1px 1px 0 rgba(0,0,0,.35)}
.bar{height:12px;border:3px solid var(--edge);background:#3a2d24;margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .35s steps(8)}
.bar i.mid{background:var(--gold)}.bar i.low{background:var(--hp)}

/* pilih starter */
#pick{left:0;right:0;bottom:0;padding:0 10px calc(env(safe-area-inset-bottom,0px) + 12px);display:none;flex-direction:column;align-items:center;gap:8px}
#pick h2{margin:0;padding:6px 14px;font-size:20px;text-align:center}
#pick .cards{display:flex;gap:8px;width:min(640px,100%)}
#pick .card{flex:1;padding:8px 6px;text-align:center;cursor:pointer;min-height:96px;font-size:14px}
#pick .card b{display:block;font-size:20px}
#pick .card.sel{background:#ffe9a8;transform:translateY(-6px)}
#pick .card .fav{font-size:12px;opacity:.75;margin-top:2px}
#go{min-width:220px;font-size:20px;background:var(--gold)}

/* battle */
#battle{inset:0;display:none}
#battle .hp{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);padding:6px 10px;width:min(240px,42vw);font-size:15px}
#battle .hp.l{left:max(12px,env(safe-area-inset-left))}#battle .hp.r{right:max(12px,env(safe-area-inset-right))}
#battle .hp .n{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:700}
#battle .hp .l2{font-family:var(--font-label);font-size:10px;opacity:.75;font-weight:400}
#battle .hp .lv{font-family:var(--font-label);font-size:10px;opacity:.7}
#battle .hp.fl{position:fixed;transform:translate(-50%,-100%);right:auto;bottom:auto;width:150px;font-size:13px;padding:4px 8px;pointer-events:none}
#snd{position:fixed;pointer-events:auto;right:max(12px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom,0px) + 90px);width:44px;height:44px;font-size:22px;padding:0;z-index:6;pointer-events:auto}
#log{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);padding:6px 16px;font-size:26px;font-weight:700;text-align:center;max-width:88vw;opacity:0;transition:opacity .15s}
#moves{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:min(660px,calc(100vw - 20px))}
#moves .row{display:flex;gap:8px;width:100%}
#moves .mv{flex:1;padding:6px 4px;min-height:64px;font-size:17px}
#moves .mv small{display:block;font-size:12px;font-weight:400}
#moves .mv.wait{opacity:.5;pointer-events:none}
#flee{min-height:38px;font-size:14px;padding:3px 14px}

/* kasih makan */
#panel{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);display:none;width:min(520px,calc(100vw - 20px));text-align:center;padding:8px 10px}
#panel h3{margin:0 0 6px;font-size:19px}
#foods{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#skip{margin-top:8px;min-height:36px;font-size:13px;padding:2px 14px}

#toast{left:50%;top:20%;transform:translate(-50%,0);font-size:24px;font-weight:700;padding:8px 18px;opacity:0;transition:opacity .25s;text-align:center;max-width:90vw}
#joy{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:120px;height:120px;border-radius:50%;background:rgba(243,233,210,.55);border:3px solid var(--edge);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--paper);border:3px solid var(--edge);box-shadow:0 3px 0 var(--edge)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--sky);font-family:var(--font-label);font-size:12px;letter-spacing:1px;z-index:9}

/* intro / cerita */
#title{inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
#title .logo{font-size:min(22vw,120px);font-weight:700;letter-spacing:4px;color:#fff;-webkit-text-stroke:0;text-shadow:-5px 0 var(--edge),5px 0 var(--edge),0 -5px var(--edge),0 5px var(--edge),-5px -5px var(--edge),5px 5px var(--edge),-5px 5px var(--edge),5px -5px var(--edge),0 9px 0 var(--edge);line-height:1}
#title .logo b{color:var(--gold)}
#title .sub{font-family:var(--font-label);font-size:min(4vw,16px);letter-spacing:2px;padding:6px 14px;background:var(--paper);border:3px solid var(--edge)}
#title .btns{display:flex;flex-direction:column;gap:10px;margin-top:10px;pointer-events:auto}
#title button{min-width:240px;font-size:22px;min-height:56px}
#title .hint{font-family:var(--font-label);font-size:10px;opacity:.7;background:rgba(243,233,210,.8);padding:2px 8px}
#create{inset:0;padding:12px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:5;overflow:auto}
#create h2{margin:0;padding:8px 18px;font-size:26px;text-align:center}
#create .cards{display:flex;gap:14px;width:min(520px,100%)}
#create .card{flex:1;padding:10px 6px;text-align:center;cursor:pointer;font-size:24px;font-weight:700;pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:4px}
#create .card img{width:min(34vw,150px);height:min(34vw,150px);image-rendering:pixelated}
#cbg{position:fixed;inset:0;display:none;z-index:4;background:linear-gradient(#7fc4e6 0%,#bfe4f0 55%,#f1e7c9 55.2%,#8ec65a 55.4%,#5f9a3a 100%)}
#cbg::before{content:'';position:absolute;left:8%;top:12%;width:90px;height:26px;background:#fff;box-shadow:30px -14px 0 #fff,60px 0 0 #fff,300px 40px 0 #fff,330px 26px 0 #fff,360px 40px 0 #fff;opacity:.9}
#intro{inset:0;display:none;z-index:9;background:transparent}
#intro .bar{position:absolute;left:0;right:0;height:0;background:#000;transition:height 1.4s ease-out}
#intro .bar.t{top:0}#intro .bar.b{bottom:0}#intro.go .bar{height:13vh}
#icap{position:absolute;left:50%;bottom:calc(13vh + 18px);transform:translateX(-50%);width:min(90vw,760px);text-align:center;color:#fff;font-size:min(6vw,30px);line-height:1.3;text-shadow:-2px 0 #000,2px 0 #000,0 -2px #000,0 2px #000,0 3px 0 #000;opacity:0;transition:opacity .5s}
#ititle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(22vw,130px);font-weight:700;letter-spacing:4px;color:#fff;text-shadow:-5px 0 var(--edge),5px 0 var(--edge),0 -5px var(--edge),0 5px var(--edge),0 9px 0 var(--edge);opacity:0;transition:opacity 1s;background:rgba(0,0,0,.35)}#ititle b{color:var(--gold)}
#iskip{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:calc(13vh + 12px);pointer-events:auto;min-height:38px;font-size:15px;padding:2px 14px;z-index:2}
#create .card.sel{background:#ffe9a8;transform:translateY(-6px)}
#nameIn{width:min(300px,90%);font:inherit;font-size:22px;text-align:center;padding:6px;border:3px solid var(--edge);background:#fff;color:var(--ink);pointer-events:auto;-webkit-user-select:text;user-select:text}
#gGo{min-width:240px;font-size:20px;background:var(--gold)}
#dlg{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);display:none;width:min(760px,calc(100vw - 16px));padding:12px 18px 16px;min-height:150px;cursor:pointer;z-index:7}
#dlg b{display:inline-block;font-family:var(--font-label);font-size:15px;letter-spacing:1px;background:var(--edge);color:#fff;padding:2px 10px;margin:-18px 0 6px -6px}
#dlg p{margin:0;font-size:27px;line-height:1.3;min-height:84px}
#dnext{position:absolute;right:12px;bottom:6px;font-size:18px;animation:bl .7s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
#obj{left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);display:none;padding:6px 14px;font-size:18px;text-align:center;max-width:46vw}
#obj small{display:block;font-family:var(--font-label);font-size:9px;opacity:.6;letter-spacing:1px}
#talk{left:50%;top:50%;right:auto;bottom:auto;display:none;pointer-events:auto;min-width:140px;min-height:56px;font-size:23px;padding:4px 18px;background:var(--gold);z-index:6;transform:translate(-50%,-100%);animation:tb .6s infinite alternate}
#talk::after{content:'';position:absolute;left:50%;bottom:-13px;margin-left:-9px;border:9px solid transparent;border-top-color:var(--edge);border-bottom:0}
@keyframes tb{to{margin-top:-9px}}
#dexb{pointer-events:auto;right:max(12px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom,0px) + 36px);display:none;width:44px;height:44px;font-size:22px;padding:0;z-index:6;left:auto}
#snd{bottom:calc(env(safe-area-inset-bottom,0px) + 90px)}
#arrow{display:none;font-size:30px;z-index:5;transform:translate(-50%,-50%);text-shadow:-2px 0 #241912,2px 0 #241912,0 -2px #241912,0 2px #241912}
#flash{inset:0;background:#fff;opacity:0;transition:opacity .35s;z-index:7}
#chap{inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(36,25,18,.82);color:#fff;text-align:center;z-index:9;pointer-events:auto}
#chap h2{font-size:min(9vw,44px);margin:0;color:var(--gold)}#chap p{font-size:20px;margin:0;max-width:80vw}#chap button{margin-top:14px}

#dlg,#dex,#home,#create .card,#chap{pointer-events:auto}
#home{left:50%;top:50%;transform:translate(-50%,-50%);display:none;width:min(640px,calc(100vw - 20px));max-height:90vh;overflow:auto;padding:10px 12px;z-index:8}
#home h3{margin:8px 0 6px;font-size:17px}#home .row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#home .hc{border:3px solid var(--edge);background:#fff;padding:5px;text-align:center;font-size:13px;display:flex;flex-direction:column;gap:3px;align-items:center}
#home .hc .em{font-size:28px;line-height:1}#home .hc b{font-size:15px}#home .hc button{min-height:34px;font-size:13px;padding:2px 6px;width:100%}
#home .hint{grid-column:1/-1;opacity:.7;font-size:13px}#home .x{display:block;margin:10px auto 0;min-height:40px;padding:2px 22px}
#moves .row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#moves .mv{min-width:0;overflow:hidden}
#moves .mv.lock{opacity:.45;background:#cfc6b0;pointer-events:none}
body[data-mode=battle] #snd,body[data-mode=battle] #dexb,body[data-mode=battle] #talk,body[data-mode=battle] #zone,body[data-mode=battle] #mates,body[data-mode=battle] #obj,
body[data-mode=feed] #snd,body[data-mode=feed] #dexb,body[data-mode=feed] #talk,body[data-mode=feed] #mates,body[data-mode=feed] #obj,
body[data-mode=dialog] #snd,body[data-mode=dialog] #dexb,body[data-mode=home] #snd,body[data-mode=home] #dexb,body[data-mode=pick] #snd,body[data-mode=create] #snd{display:none!important}
@media (max-width:560px){#zone{font-size:15px;max-width:48vw}#pick .card b{font-size:17px}#mates{max-width:44vw}}
@media (max-aspect-ratio:1/1){
 #zone{max-width:50vw;padding:5px 9px}#mates{max-width:42vw;padding:5px 8px}
 #obj{top:calc(env(safe-area-inset-top,0px) + 66px);max-width:calc(100vw - 24px);width:max-content;font-size:14px;padding:4px 10px}
 #moves .row{grid-template-columns:1fr 1fr}#moves .mv{min-height:56px;font-size:15px}
 #log{top:calc(env(safe-area-inset-top,0px) + 14px);font-size:20px}
 #dlg p{font-size:24px}
 #home .row{grid-template-columns:repeat(3,1fr)}
 #foods{grid-template-columns:repeat(3,1fr)}
 #foods button{font-size:14px;padding:4px 2px}
}
@media (max-height:480px) and (orientation:landscape){
 #zone{font-size:15px;padding:4px 10px}#zone small{display:none}
 #mates{padding:4px 8px;font-size:13px}
 #obj{font-size:13px;padding:3px 10px;max-width:40vw}
 #dlg{min-height:100px;padding:8px 14px 10px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}#dlg p{font-size:21px;min-height:56px}
 #pick h2{font-size:16px;padding:3px 10px}#pick .card{min-height:70px;padding:4px}#pick .card b{font-size:16px}#pick .card .fav{display:none}
 #create h2{font-size:18px}#create .card{font-size:18px;flex-direction:row;padding:4px 8px}#create .card img{width:70px;height:70px}#create{gap:6px}
 #moves .mv{min-height:46px;font-size:15px;padding:3px}#moves .mv small{font-size:11px}#flee{min-height:30px;font-size:13px}
 #log{font-size:18px}
 #panel{padding:5px 8px}#panel h3{font-size:15px;margin-bottom:4px}#foods{grid-template-columns:repeat(6,1fr)}#foods button{font-size:12px;padding:2px}
 #home{max-height:94vh}
 #joy{width:100px;height:100px}
 #toast{top:14%;font-size:20px}
}

/* layar penuh: Maimondex / Tim Saya / Tas */
#menu{right:max(12px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom,0px) + 90px);display:none;flex-direction:column;gap:6px;padding:8px;z-index:7}
#menu button{pointer-events:auto;min-width:170px;min-height:46px;font-size:18px;text-align:left;padding:0 12px}
.scr{position:fixed;left:50%;top:max(8px,env(safe-area-inset-top));bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(820px,calc(100vw - 16px));display:none;flex-direction:column;background:var(--paper);border:3px solid var(--edge);box-shadow:0 4px 0 var(--edge);z-index:8;pointer-events:auto;overflow:hidden}
.scr .sh{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 12px;color:#fff;border-bottom:3px solid var(--edge);flex:0 0 auto}
.scr .sh b{font-size:22px;letter-spacing:1px;text-shadow:0 2px 0 rgba(0,0,0,.3)}

.scr .sh button{min-height:36px;min-width:42px;padding:0 10px;font-size:18px}
#dex .sh{background:#c8402c}#team .sh{background:#2f7a8a}#bag .sh{background:#a8742a}
.scr .body{flex:1;overflow:auto;padding:10px;min-height:0}
.dexbody{flex:1;display:flex;min-height:0}
#dexl{width:38%;max-width:300px;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:6px;border-right:3px solid var(--edge);background:var(--paper-2)}
#dexd{flex:1;overflow:auto;padding:10px;min-width:0}
.dr{display:flex;align-items:center;gap:8px;border:3px solid var(--edge);background:#fff;padding:3px 6px;cursor:pointer;position:relative;flex:0 0 auto}

.plate .t .evo{font-size:12px;opacity:.95;margin-bottom:6px}

.quote{border:3px solid var(--edge);background:#fff;padding:7px 9px;font-size:14px;line-height:1.35}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{border:3px solid var(--edge);background:#fff;padding:5px 4px;text-align:center;font-size:13px;min-width:0}.stat small{display:block;font-family:var(--font-label);font-size:9px;opacity:.6}
.chips2{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.mr{display:flex;align-items:center;gap:6px;border:3px solid var(--edge);background:#fff;padding:3px 6px;margin-bottom:4px;font-size:14px}.mr .lvb{font-family:var(--font-label);font-size:9px;background:var(--edge);color:#fff;padding:1px 5px}
.mr .pw{flex:1;height:8px;background:#ddd;min-width:30px}.mr .pw i{display:block;height:100%}.mr.lk{opacity:.5}
.hint2{opacity:.7;font-size:13px;padding:8px}

.tc{border:3px solid var(--edge);background:#fff;padding:8px;display:flex;flex-direction:column;gap:6px}
.tc .hd{display:flex;gap:8px;align-items:center}.tc .hd img{width:72px;height:72px;image-rendering:pixelated;flex:0 0 72px;background:var(--paper-2);border:2px solid var(--edge)}
.tc .hd b{font-size:18px;display:block;line-height:1.1}.tc .hd small{font-family:var(--font-label);font-size:10px;opacity:.7}
.tb{height:10px;background:#d9cfb8;border:2px solid var(--edge)}.tb i{display:block;height:100%}
.tl{display:flex;justify-content:space-between;font-family:var(--font-label);font-size:9px;opacity:.75;margin-bottom:2px}
.mvg{display:grid;grid-template-columns:1fr 1fr;gap:4px}.mvg .m{border:2px solid var(--edge);padding:2px 5px;font-size:12px;display:flex;gap:4px;align-items:center;min-width:0;background:var(--paper)}.mvg .m.lk{opacity:.5}

.bagg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.bi{border:3px solid var(--edge);background:#fff;padding:8px;display:flex;gap:10px;align-items:center}.bi.zero{opacity:.55;background:#e6dcc3}
.bi .em{font-size:38px;line-height:1}.bi b{font-size:17px;display:block}.bi .n{font-family:var(--font-label);font-size:12px;color:#a8742a}.bi small{display:block;font-size:11px;opacity:.75;line-height:1.25;margin-top:2px}
.feedbtn small{display:block}
#foods button small{display:block;font-family:var(--font-label);font-size:10px;opacity:.7}#foods button.none{opacity:.45}
#phint{font-size:12px;margin-top:6px;opacity:.8;line-height:1.3}#phint:empty{display:none}
#fishui{left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:none;flex-direction:column;align-items:center;gap:8px;z-index:7}
#fishmsg{padding:6px 14px;font-size:18px;text-align:center}

@keyframes pl{to{transform:scale(1.08)}}
#fishx{pointer-events:auto;min-height:34px;font-size:13px}
body[data-mode=menu] #snd,body[data-mode=menu] #talk,body[data-mode=fish] #snd,body[data-mode=fish] #dexb,body[data-mode=fish] #talk,body[data-mode=fish] #obj,body[data-mode=fish] #mates{display:none!important}

 .dexbody{flex-direction:column}

 .dr{flex:0 0 78px;flex-direction:column;padding:4px 2px;text-align:center;gap:2px}.dr.sel{transform:translateY(3px)}.dr .nm b{font-size:12px}.dr small{display:none}
 .plate img{width:104px;height:104px}.plate .t b{font-size:20px}
