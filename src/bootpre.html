<script>
/* dipasang paling awal: ketukan pertama (kapan pun) membuka audio, supaya musik bisa jalan setelah loading */
window.__boot = { tapped: false, ctx: null, unlock() {
  this.tapped = true;
  try { if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; this.ctx = new AC({ latencyHint: 'playback' }); window.__bootCtx = this.ctx; } if (this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) {}
} };
['pointerdown', 'touchend', 'click', 'keydown'].forEach((ev) => addEventListener(ev, () => { if (window.__boot && !window.__boot.noboot) window.__boot.unlock(); }, true));
</script>
